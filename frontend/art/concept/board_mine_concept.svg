<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12101a"/><stop offset="1" stop-color="#241d16"/>
    </linearGradient>
    <radialGradient id="glowN" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4fc3f7"/><stop offset="1" stop-color="#4fc3f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowS" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb347"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowW" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b0a090"/><stop offset="1" stop-color="#b0a090" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowE" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e5533d"/><stop offset="1" stop-color="#e5533d" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <!-- шахта 8x8, тайл 80px, origin (80,80) -->
  <g stroke="#0c0a10" stroke-width="2">
    <rect x="80" y="80" width="640" height="640" fill="#2a2530"/>
    <!-- стены -->
    <g fill="#7a6550">
      <rect x="240" y="80" width="80" height="80"/><rect x="320" y="80" width="80" height="80"/>
      <rect x="80" y="240" width="80" height="80"/><rect x="560" y="160" width="80" height="80"/>
      <rect x="400" y="320" width="80" height="80"/><rect x="160" y="400" width="80" height="80"/>
      <rect x="640" y="400" width="80" height="80"/><rect x="240" y="560" width="80" height="80"/>
      <rect x="480" y="640" width="80" height="80"/><rect x="560" y="640" width="80" height="80"/>
    </g>
    <!-- строительные камни -->
    <g fill="#c8c2bb"><circle cx="200" cy="200" r="26"/><circle cx="440" cy="120" r="26"/><circle cx="120" cy="520" r="26"/><circle cx="600" cy="360" r="26"/></g>
    <!-- драгоценный камень -->
    <polygon points="360,480 380,455 400,480 380,505" fill="#9a5fd0"/>
    <!-- гриб и кристалл -->
    <g><ellipse cx="520" cy="520" rx="26" ry="16" fill="#d94f5c"/><rect x="512" y="520" width="16" height="22" fill="#efe6d8"/></g>
    <polygon points="280,320 300,290 320,320 300,350" fill="#4fdde0"/>
    <!-- жёлтая клетка спавна камней -->
    <rect x="640" y="320" width="80" height="80" fill="#d9c63f"/>
    <!-- зелёная клетка лазутчиков -->
    <rect x="80" y="320" width="80" height="80" fill="#3f8a3f"/>
  </g>
  <!-- ВЫХОД СЕВЕР: арка с синим кристаллом -->
  <g><circle cx="400" cy="60" r="60" fill="url(#glowN)"/>
    <path d="M360 80 v-30 a40 40 0 0 1 80 0 v30 z" fill="#5d4a38" stroke="#2a2018" stroke-width="4"/>
    <polygon points="400,25 412,50 400,68 388,50" fill="#4fc3f7"/></g>
  <!-- ВЫХОД ЮГ: янтарный фонарь -->
  <g><circle cx="400" cy="740" r="60" fill="url(#glowS)"/>
    <path d="M360 720 v30 a40 40 0 0 0 80 0 v-30 z" fill="#5d4a38" stroke="#2a2018" stroke-width="4"/>
    <circle cx="400" cy="762" r="12" fill="#ffb347"/><rect x="396" y="748" width="8" height="26" fill="#3a2c1e"/></g>
  <!-- ВЫХОД ЗАПАД: рудная тележка -->
  <g><circle cx="60" cy="400" r="60" fill="url(#glowW)"/>
    <path d="M80 360 h-30 a40 40 0 0 0 0 80 h30 z" fill="#5d4a38" stroke="#2a2018" stroke-width="4"/>
    <path d="M20 400 h34 l-6 22 h-22 z" fill="#8a8f98"/><circle cx="30" cy="428" r="6" fill="#333"/><circle cx="46" cy="428" r="6" fill="#333"/></g>
  <!-- ВЫХОД ВОСТОК: знамёна клана -->
  <g><circle cx="740" cy="400" r="60" fill="url(#glowE)"/>
    <path d="M720 360 h30 a40 40 0 0 1 0 80 h-30 z" fill="#5d4a38" stroke="#2a2018" stroke-width="4"/>
    <rect x="756" y="352" width="4" height="60" fill="#caa64a"/><path d="M760 356 l26 8 -26 8 z" fill="#e5533d"/></g>
  <text x="400" y="785" font-family="monospace" font-size="20" fill="#cbb" text-anchor="middle">Shaft concept: exits on all 4 sides (arch portals)</text>
</svg>
